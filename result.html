<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Result Page</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="trivia.css">
    </head>
    <body>
        <div class="container">
            <div id="Result" class="flex-center flex-column">
                <h1 id="finalScore"></h1>
                <form>
                    <input
                      type="text"
                      name="username"
                      id="username"
                      placeholder="username"
                    />
                    <button
                       type="submit"
                       class="Resultbtn"
                       id="saveScoreBtn"
                       onclick="saveHighScore(event)"
                    > 
                       Save
                    </button>
                </form>
                <a class="Resultbtn" href="trivia.html">Play Again</a>
                <a class="Resultbtn" href="characters.html" id="goToCharBtn">Go To Character's Home</a>
                <a class="Resultbtn" href="index.html">Go Main Home Page</a>
            </div>
        </div>
        <script src="scripts/result.js"></script>
    </body>
</html>
