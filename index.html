<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"/>
        <title>Harry Potter Trivia Web Application</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <h1>Harry Potter Trivia!!</h1>
        <section class="container">
            <section class="section-Title">
              <button  onclick="showHideCharacters()" class="clickopt1">Select From These Characters or Even the whole Series</button>
            </section>
            <section class="characters-sec">
                <div class="characters&series">
                    <div class="character">Harry Potter</div>
                    <div class="pic">
                        <a href="characters.html?id=char1">
                        <button id="char1"><img src="./images/Harry.jpg" alt="HarryPotter" width="600px" height="700px"/></button>
                        </a>
                    </div>
                </div>
                <div class="characters&series">
                    <div class="characters">Hermione Granger</div>
                    <div class="pic">
                        <a href="characters.html?id=char2">
                        <button id="char2"><img src="./images/Hermione.jpg" alt="Hermione Granger" width="600px" height="700px"/></button>
                        </a>
                    </div>
                </div>
                <div class="characters&series">
                    <div class="character">Ron Weasley</div>
                    <div class="pic">
                        <a href="characters.html?id=char3">
                        <button id="char3"><img src="./images/RonWisley.jpg" alt="Ron Weasley" width="600px" height="700px"/></button>
                        </a>
                    </div>
                </div>
            </section>
        </section>
        <script src="scripts/home.js"></script>
    </body>
</html>
